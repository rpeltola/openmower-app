name: Build PR

# Builds the Docker image for pull requests (including forks) and uploads it as
# an artifact. Pushing to GHCR happens in a separate, privileged workflow
# (push-pr-image.yml) triggered via workflow_run, so that fork PRs — which have
# no access to repository secrets — can still produce installable images.

on:
  pull_request:
    branches:
      - main

# Stop obsolete runs for the same PR.
concurrency:
  group: build-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: openmower-app-pr:latest
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha,scope=pr-${{ matrix.arch }}
          cache-to: type=gha,scope=pr-${{ matrix.arch }},mode=max

      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/image.tar
          if-no-files-found: error
          retention-days: 1
